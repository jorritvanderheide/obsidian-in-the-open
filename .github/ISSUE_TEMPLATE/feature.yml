name: Feature request
description: An idea for something In the Open could do, or do better.
labels: ['enhancement']
body:
    - type: markdown
      attributes:
          value: |
              Thanks for sharing your idea. It helps most to hear what you're trying to get done, more than how you'd build it.

    - type: textarea
      id: goal
      attributes:
          label: What are you trying to do?
          description: What you're publishing, where it goes, and the moment this came up.
      validations:
          required: true

    - type: textarea
      id: problem
      attributes:
          label: What gets in the way today?
      validations:
          required: true

    - type: textarea
      id: idea
      attributes:
          label: What would help?
          description: Optional. If you have a picture of how it could work, describe it here.
