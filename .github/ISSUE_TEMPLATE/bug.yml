name: Bug report
description: Something doesn't work the way In the Open's README says it should.
labels: ['bug']
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to report this. Before you start, have a quick look at the [FAQ](https://github.com/jorritvanderheide/obsidian-in-the-open/blob/main/FAQ.md).

              Found a security problem? Please don't report it here. Use [private reporting](https://github.com/jorritvanderheide/obsidian-in-the-open/security/advisories/new) instead.

    - type: textarea
      id: what
      attributes:
          label: What happened?
          description: And what did you expect to happen instead? If In the Open or your site showed an error, please paste it.
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          description: The smallest note that shows the problem helps most, with the bibliography entry it cites. A screenshot of the post on your site helps too.
          placeholder: |
              1. A note containing: As [[marsh2024|-marsh2024, p. 12]] argues.
              2. Publish note
              3. ...
      validations:
          required: true

    - type: input
      id: site
      attributes:
          label: Your site
          description: The software your site takes posts with, and whether it takes the references extension, if you know.
          placeholder: WordPress with the Micropub plugin, my own code, ...
      validations:
          required: true

    - type: input
      id: version
      attributes:
          label: In the Open version
          description: Settings → Community plugins, next to In the Open.
      validations:
          required: true

    - type: input
      id: obsidian
      attributes:
          label: Obsidian version
          description: Settings → General.
      validations:
          required: true

    - type: input
      id: os
      attributes:
          label: Operating system
          placeholder: macOS 15, Windows 11, Ubuntu 24.04, ...
      validations:
          required: true

    - type: input
      id: pandoc
      attributes:
          label: Pandoc version
          description: The first line of `pandoc --version`, or "built-in" if In the Open downloaded its own.
      validations:
          required: true

    - type: input
      id: style
      attributes:
          label: Citation style
          description: As in Settings → In the Open → Citation style. Empty means Chicago author-date.
          placeholder: apa

    - type: dropdown
      id: bib
      attributes:
          label: Where does your bibliography come from?
          options:
              - Better BibTeX auto-export
              - Another tool, or by hand
              - I don't use one
      validations:
          required: true

    - type: textarea
      id: extra
      attributes:
          label: Anything else?
          description: An error from the developer console (Ctrl+Shift+I, or Cmd+Option+I on a Mac), what your site logged, or anything else that seems related. Please leave your token out.
